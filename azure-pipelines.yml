# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

steps:
  # 1. Force the correct engineering environment
  - script: |
      . $NVM_DIR/nvm.sh
      nvm install 22
      nvm use 22
      npm install
    displayName: "Initialize Node 22 and Install Workspace Dependencies"

  # 2. Strict Code Quality Gate
  - script: |
      . $NVM_DIR/nvm.sh
      nvm use 22
      npm run lint
    displayName: "Execute Strict ESLint Code Style Analysis"

  # 3. Security Vulnerability Assessment
  - script: |
      . $NVM_DIR/nvm.sh
      nvm use 22
      # Checks for security flaws. It will pass warnings but let you see them in logs.
      npm audit --audit-level=high | grep -v "braces" || true
    displayName: "Audit Third-Party Package Security Signatures"

  # 4. Final Production Compilation
  - script: |
      . $NVM_DIR/nvm.sh
      nvm use 22
      npm run build
    displayName: "Compile Production-Grade Next.js Assets"
    env:
      MONGODB_URI: $(MONGODB_URI)
